name: Build 351Files

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout 351Files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Verify Docker
        run: |
          docker --version
          docker info
          make --version
    
      - name: Checkout AmberELEC build system
        uses: actions/checkout@v4
        with:
          repository: AmberELEC/AmberELEC
          ref: dev
          path: AmberELEC
          fetch-depth: 1

      - name: Pull AmberELEC build container
        working-directory: AmberELEC
        run: |
          make docker-image-pull

      - name: Pre-seed GNU-mirror sources (bypass flaky ftpmirror.gnu.org)
        working-directory: AmberELEC
        run: |
          set -o pipefail
          mkdir -p sources
          grep -rl 'ftpmirror\.gnu\.org' packages/devel --include=package.mk | while read -r pkgmk; do
            (
              PKG_NAME=""; PKG_VERSION=""; PKG_SHA256=""; PKG_URL=""
              source "$pkgmk"
              [ -z "$PKG_URL" ] && exit 0
              case "$PKG_URL" in *ftpmirror.gnu.org*) ;; *) exit 0 ;; esac

              src_name="${PKG_URL##*/}"
              mirror_url="http://ftp.gnu.org/gnu${PKG_URL#http://ftpmirror.gnu.org}"
              dest_dir="sources/${PKG_NAME}"
              dest="${dest_dir}/${src_name}"

              if [ -f "$dest" ] && [ -f "${dest}.sha256" ] && [ "$(cat "${dest}.sha256")" = "$PKG_SHA256" ]; then
                echo "Already cached: $PKG_NAME"
                exit 0
              fi

              mkdir -p "$dest_dir"
              echo "Pre-seeding $PKG_NAME <- $mirror_url"
              if curl -fL --retry 5 --retry-delay 5 -o "$dest" "$mirror_url"; then
                calc="$(sha256sum "$dest" | cut -d' ' -f1)"
                if [ -n "$PKG_SHA256" ] && [ "$calc" != "$PKG_SHA256" ]; then
                  echo "Checksum mismatch for $PKG_NAME, skipping (will fall back to normal fetch)"
                  rm -f "$dest"
                  exit 0
                fi
                echo "$PKG_URL" > "${dest}.url"
                echo "$calc" > "${dest}.sha256"
              else
                echo "Could not pre-seed $PKG_NAME from ftp.gnu.org, will fall back to normal fetch"
                rm -f "$dest"
              fi
            )
          done

      - name: Build RK3326 toolchain
        working-directory: AmberELEC
        run: |
          set -e

          export DOCKER_WORK_DIR=/work

          make docker-toolchain-RK3326

      - name: Verify toolchain
        working-directory: AmberELEC
        run: |
          set -e

          TOOLCHAIN="$PWD/build.AmberELEC-RK3326.aarch64/toolchain"

          test -x "$TOOLCHAIN/bin/aarch64-libreelec-linux-gnueabi-g++"
          test -x "$TOOLCHAIN/aarch64-libreelec-linux-gnueabi/sysroot/usr/bin/sdl2-config"

          "$TOOLCHAIN/bin/aarch64-libreelec-linux-gnueabi-g++" --version
          "$TOOLCHAIN/aarch64-libreelec-linux-gnueabi/sysroot/usr/bin/sdl2-config" --version || true

      - name: Build 351Files packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/AmberELEC/build.AmberELEC-RK3326.aarch64/toolchain"
          TARGET="aarch64-libreelec-linux-gnueabi"

          export CC="$TOOLCHAIN/bin/${TARGET}-g++"
          export STRIP="$TOOLCHAIN/bin/${TARGET}-strip"
          export SDL2_CONFIG="$TOOLCHAIN/${TARGET}/sysroot/usr/bin/sdl2-config"

          rm -rf build
          mkdir -p build

          build351Files() {
            DEVICE="$1"
            FIRMWARE="$2"
            START_PATH="$3"
            RES_PATH="$4"

            echo "========================================"
            echo "Building $DEVICE / $FIRMWARE"
            echo "========================================"

            make clean

            make \
              CC="$CC" \
              DEVICE="$DEVICE" \
              SDL2_CONFIG="$SDL2_CONFIG" \
              START_PATH="$START_PATH" \
              RES_PATH="$RES_PATH"

            "$STRIP" 351Files

            rm -rf build/351Files
            mkdir -p build/351Files

            cp -r 351Files README.md res build/351Files
            cp "launchers/$FIRMWARE/351Files.sh" build

            (
              cd build
              tar zcf \
                "351Files-${VERSION}_${DEVICE}_${FIRMWARE}.tgz" \
                351Files.sh \
                351Files
            )

            rm -rf build/351Files
            rm -f build/351Files.sh

            make clean
          }

          build351Files RG351V 351ELEC /storage/roms ./res
          build351Files RG351P 351ELEC /storage/roms ./res
          build351Files RG351V ArkOS    /roms          ./res
          build351Files RG351P ArkOS    /roms          ./res

          ls -lh build/*.tgz

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: 351Files-${{ steps.version.outputs.version }}
          path: build/*.tgz
          if-no-files-found: error
