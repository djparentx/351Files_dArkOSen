name: Build 351Files

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout 351Files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Verify Docker
        run: |
          docker --version
          docker info
          make --version
    
      - name: Checkout AmberELEC build system
        uses: actions/checkout@v4
        with:
          repository: AmberELEC/AmberELEC
          ref: dev
          path: AmberELEC
          fetch-depth: 1

      - name: Pull AmberELEC build container
        working-directory: AmberELEC
        run: |
          make docker-image-pull

      - name: Pre-seed autoconf source (bypass flaky ftpmirror.gnu.org)
        run: |
          set -e
          mkdir -p AmberELEC/sources/autoconf
          curl -fL --retry 5 --retry-delay 5 \
            -o AmberELEC/sources/autoconf/autoconf-2.71.tar.xz \
            https://ftp.gnu.org/gnu/autoconf/autoconf-2.71.tar.xz
          echo "f14c83cfebcc9427f2c3cea7258bd90df972d92eb26752da4ddad81c87a0faa4  AmberELEC/sources/autoconf/autoconf-2.71.tar.xz" | sha256sum -c -
          echo "http://ftpmirror.gnu.org/autoconf/autoconf-2.71.tar.xz" > AmberELEC/sources/autoconf/autoconf-2.71.tar.xz.url
          echo "f14c83cfebcc9427f2c3cea7258bd90df972d92eb26752da4ddad81c87a0faa4" > AmberELEC/sources/autoconf/autoconf-2.71.tar.xz.sha256

      - name: Build RK3326 toolchain
        working-directory: AmberELEC
        run: |
          set -e

          export DOCKER_WORK_DIR=/work

          make docker-toolchain-RK3326

      - name: Verify toolchain
        working-directory: AmberELEC
        run: |
          set -e

          TOOLCHAIN="$PWD/build.AmberELEC-RK3326.aarch64/toolchain"

          test -x "$TOOLCHAIN/bin/aarch64-libreelec-linux-gnueabi-g++"
          test -x "$TOOLCHAIN/aarch64-libreelec-linux-gnueabi/sysroot/usr/bin/sdl2-config"

          "$TOOLCHAIN/bin/aarch64-libreelec-linux-gnueabi-g++" --version
          "$TOOLCHAIN/aarch64-libreelec-linux-gnueabi/sysroot/usr/bin/sdl2-config" --version || true

      - name: Build 351Files packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/AmberELEC/build.AmberELEC-RK3326.aarch64/toolchain"
          TARGET="aarch64-libreelec-linux-gnueabi"

          export CC="$TOOLCHAIN/bin/${TARGET}-g++"
          export STRIP="$TOOLCHAIN/bin/${TARGET}-strip"
          export SDL2_CONFIG="$TOOLCHAIN/${TARGET}/sysroot/usr/bin/sdl2-config"

          rm -rf build
          mkdir -p build

          build351Files() {
            DEVICE="$1"
            FIRMWARE="$2"
            START_PATH="$3"
            RES_PATH="$4"

            echo "========================================"
            echo "Building $DEVICE / $FIRMWARE"
            echo "========================================"

            make clean

            make \
              CC="$CC" \
              DEVICE="$DEVICE" \
              SDL2_CONFIG="$SDL2_CONFIG" \
              START_PATH="$START_PATH" \
              RES_PATH="$RES_PATH"

            "$STRIP" 351Files

            rm -rf build/351Files
            mkdir -p build/351Files

            cp -r 351Files README.md res build/351Files
            cp "launchers/$FIRMWARE/351Files.sh" build

            (
              cd build
              tar zcf \
                "351Files-${VERSION}_${DEVICE}_${FIRMWARE}.tgz" \
                351Files.sh \
                351Files
            )

            rm -rf build/351Files
            rm -f build/351Files.sh

            make clean
          }

          build351Files RG351V 351ELEC /storage/roms ./res
          build351Files RG351P 351ELEC /storage/roms ./res
          build351Files RG351V ArkOS    /roms          ./res
          build351Files RG351P ArkOS    /roms          ./res

          ls -lh build/*.tgz

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: 351Files-${{ steps.version.outputs.version }}
          path: build/*.tgz
          if-no-files-found: error
